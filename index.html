<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kqwaiyi's Flashcards App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EZFlashcards" />

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="sidebar">
      <div class="sidebar-title">
        <p>EZFlashcards</p>
        <img src="assets/logo.svg" alt="logo" />
      </div>
      <hr />
      <div class="sidebar-items js-sidebar-home selected">
        <img src="assets/home.svg" alt="home icon" />
        <p>Home</p>
      </div>
      <div class="sidebar-items js-sidebar-add">
        <img src="assets/add.svg" alt="add decks icon" />
        <p>Add Decks</p>
      </div>
      <div class="sidebar-items js-sidebar-study">
        <img src="assets/study.svg" alt="study decks icon" />
        <p>Study</p>
      </div>
    </nav>

    <main class="main-screen"></main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
